<mat-toolbar class="app-toolbar">
  <a
    class="app-toolbar__brand"
    routerLink="/dashboard"
    [attr.aria-label]="'app.title' | transloco"
  >
    <mat-icon aria-hidden="true">forest</mat-icon>
    <span>{{ 'app.title' | transloco }}</span>
  </a>

  <nav class="app-toolbar__nav" [attr.aria-label]="'app.navigation' | transloco">
    <a
      class="app-toolbar__link"
      mat-button
      routerLink="/dashboard"
      routerLinkActive="app-toolbar__link--active"
    >
      <mat-icon aria-hidden="true">dashboard</mat-icon>
      <span>{{ 'app.dashboard' | transloco }}</span>
    </a>
    <a
      class="app-toolbar__link"
      mat-button
      routerLink="/animals"
      routerLinkActive="app-toolbar__link--active"
    >
      <mat-icon aria-hidden="true">pets</mat-icon>
      <span>{{ 'app.animals' | transloco }}</span>
    </a>
  </nav>
</mat-toolbar>

<main class="app-content">
  <router-outlet />
</main>
